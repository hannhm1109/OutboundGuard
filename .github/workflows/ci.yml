name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            symfony: '6.4'
          - php: '8.2'
            symfony: '7.4'
          - php: '8.4'
            symfony: '8.1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
          tools: composer:v2
          coverage: none
      - name: Select the Symfony branch
        env:
          SYMFONY_VERSION: ${{ matrix.symfony }}.*
        run: |
          composer require --no-interaction --no-update \
            "symfony/config:$SYMFONY_VERSION" \
            "symfony/dependency-injection:$SYMFONY_VERSION" \
            "symfony/event-dispatcher:$SYMFONY_VERSION" \
            "symfony/http-client:$SYMFONY_VERSION" \
            "symfony/http-foundation:$SYMFONY_VERSION" \
            "symfony/http-kernel:$SYMFONY_VERSION"
          composer require --dev --no-interaction --no-update "symfony/framework-bundle:$SYMFONY_VERSION"
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: composer check
